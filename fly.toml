# Fly.io: one always-on VM for the Telegram bot + FastAPI + WebSockets + mini-app.
# Keep min_machines_running = 1. A second replica splits bingo rooms and causes
# Telegram 409 polling conflicts.
#
# First-time: see DEPLOY.md (create app, volume, secrets, then fly deploy).

app = "etoobingobot"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  SERVER_PORT = "8080"
  DATABASE_PATH = "/data/goodbingo.db"
  WEBAPP_URL = "https://etoobingobot.fly.dev"
  PEERPAY_RETURN_URL = "https://etoobingobot.fly.dev/deposits/return"
  VERIFY_BASE_URL = "https://verify.et"
  # VERIFY_ET_API_KEY is set as a fly secret: fly secrets set VERIFY_ET_API_KEY=VERIFY_BANK_ET_...

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 2000
    soft_limit = 1800

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "goodbingo_data"
  destination = "/data"

[[vm]]
  cpu_kind = "performance"
  cpus = 2
  memory_mb = 2048
